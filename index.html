<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Techu</title>
<link rel="icon" href="Bakwaas.jpeg">
<link rel="apple-touch-icon" href="Bakwaas.jpeg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  html, body { margin: 0; height: 100%; background: #ffffff; color: #111; overflow: hidden; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; background: #fff; }
  .screen.active { display: flex; }
  .fade-in { animation: fade .45s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Login */
  #login { align-items: center; justify-content: center; padding: 28px; }
  .logo-img { width: 120px; height: 120px; border-radius: 28px; object-fit: cover; margin-bottom: 10px; box-shadow: 0 8px 30px #0001; }
  .brand { font-size: 30px; font-weight: 800; color: #111; margin-bottom: 4px; }
  .sub { color: #8a8a8e; font-size: 14px; margin-bottom: 30px; }
  .form { width: 100%; max-width: 330px; }
  .form input {
    width: 100%; padding: 15px 16px; margin-bottom: 12px; border-radius: 14px;
    border: 1px solid #e3e3e8; background: #f6f6f8; font-size: 16px; color: #111;
  }
  .form input:focus { outline: none; border-color: #0a84ff; background: #fff; }
  .primary { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: #0a84ff; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  .primary:active { transform: scale(.98); }
  .err { color: #ff3b30; font-size: 13px; min-height: 18px; margin: 4px 2px 10px; text-align: center; }

  /* Dashboard */
  #dash { background: #fff; }
  .top { padding: calc(16px + env(safe-area-inset-top)) 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f3; }
  .top img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .top .t { font-weight: 700; font-size: 18px; }
  .top .who { margin-left: auto; color: #8a8a8e; font-size: 13px; }
  .list { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .card { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid #ececf0; border-radius: 18px; background: #fff; box-shadow: 0 2px 10px #0000000a; cursor: pointer; }
  .card:active { background: #f6f6f8; }
  .card img { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; background: #eee; }
  .card .info { flex: 1; }
  .card .name { font-weight: 700; font-size: 17px; }
  .card .act { color: #0a84ff; font-size: 14px; margin-top: 2px; }
  .card .ic { font-size: 24px; }

  /* Call */
  #call { background: #0b0b0d; color: #fff; }
  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0b0b0d; }
  .callLogo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 1; }
  .callLogo img { width: 120px; height: 120px; border-radius: 30px; object-fit: cover; }
  #localVideo { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; width: 104px; height: 150px; object-fit: cover; border-radius: 14px; border: 2px solid #ffffff44; background: #222; z-index: 4; }
  .cHead { position: absolute; top: calc(20px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; z-index: 3; }
  .cHead .n { font-size: 22px; font-weight: 700; }
  .cHead .s { font-size: 14px; color: #c7c7cc; margin-top: 4px; }
  .bar { position: absolute; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 22px 18px calc(26px + env(safe-area-inset-bottom)); }
  .rb { width: 62px; height: 62px; border-radius: 50%; border: 0; font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .rb.g { background: #2c2c2e; }
  .rb.active { background: #fff; color: #111; }
  .rb.answer { background: #34c759; }
  .rb.end { background: #ff3b30; }
  .rb:active { transform: scale(.94); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="login">
  <img class="logo-img" src="Bakwaas.jpeg" alt="logo" onerror="this.style.display='none'">
  <div class="brand">Techu</div>
  <div class="sub">Sign in to continue</div>
  <div class="form">
    <input id="caseId" placeholder="Case ID" inputmode="numeric" autocomplete="off" autocapitalize="off">
    <input id="pass" type="password" placeholder="Password" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="primary" id="loginBtn">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="screen" id="dash">
  <div class="top">
    <img src="Bakwaas.jpeg" onerror="this.style.display='none'">
    <div class="t">Techu</div>
    <div class="who" id="whoAmI"></div>
  </div>
  <div class="list">
    <div class="card" id="cardAudio">
      <img src="Bakwaas.jpeg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22/>'">
      <div class="info"><div class="name">Support</div><div class="act">Audio call</div></div>
      <div class="ic">🎙️</div>
    </div>
    <div class="card" id="cardVideo">
      <img src="Bakwaas.jpeg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22/>'">
      <div class="info"><div class="name">Support</div><div class="act">Video call</div></div>
      <div class="ic">📹</div>
    </div>
  </div>
</div>

<!-- CALL -->
<div class="screen" id="call">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="callLogo" id="callLogo"><img src="Bakwaas.jpeg" onerror="this.style.display='none'"></div>
  <video id="localVideo" autoplay playsinline muted class="hidden"></video>
  <div class="cHead">
    <div class="n" id="peerName">Support</div>
    <div class="s" id="callStat">Calling…</div>
  </div>
  <div class="bar">
    <button class="rb g active" id="btnMute" title="Mute">🎤</button>
    <button class="rb g active" id="btnSpk" title="Speaker">🔊</button>
    <button class="rb answer hidden" id="btnAnswer" title="Answer">📞</button>
    <button class="rb end" id="btnEnd" title="Hang up">📴</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  "use strict";

  var IS_ADMIN = false;
  var PREFIX = "techu2v1-";
  var ADMIN_ID = PREFIX + "admin";
  var VALID = { "556221": true, "997204": true };
  var PASSWORD = "6macs0";

  var ICE = { iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ]};

  var $ = function (id) { return document.getElementById(id); };
  function show(id) { ["login","dash","call"].forEach(function (s) { var el=$(s); if(el) el.classList.toggle("active", s===id); }); var a=$(id); if(a){ a.classList.remove("fade-in"); void a.offsetWidth; a.classList.add("fade-in"); } }

  var peer = null, myCaseId = null, localStream = null, currentCall = null, incomingCall = null, wantVideo = false;

  function myId() { return PREFIX + "user-" + myCaseId; }

  function initPeer() {
    peer = new Peer(myId(), { config: ICE, debug: 1 });
    peer.on("error", function (e) { console.log("peer error", e); });
    peer.on("call", function (c) {
      incomingCall = c;
      wantVideo = !!(c.metadata && c.metadata.video);
      openCall("Support", wantVideo, true);
      $("callStat").textContent = (wantVideo ? "Incoming video call…" : "Incoming audio call…");
      $("btnAnswer").classList.remove("hidden");
    });
  }

  async function getMedia(video) {
    return navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: "user" } : false });
  }

  function openCall(name, video, incoming) {
    $("peerName").textContent = name;
    show("call");
    $("localVideo").classList.toggle("hidden", !video);
    $("callLogo").classList.toggle("hidden", video);
    $("remoteVideo").classList.toggle("hidden", false);
    if (!incoming) $("btnAnswer").classList.add("hidden");
  }

  function wire(call) {
    currentCall = call;
    call.on("stream", function (remote) {
      $("remoteVideo").srcObject = remote;
      var hasVideo = remote.getVideoTracks().length > 0;
      $("callLogo").classList.toggle("hidden", hasVideo);
      $("callStat").textContent = "Connected";
    });
    call.on("close", endUI);
    call.on("error", function () { $("callStat").textContent = "Call error"; });
  }

  async function startCall(video) {
    wantVideo = video;
    try { localStream = await getMedia(video); }
    catch (e) { alert("Camera/mic allow karo (Safari settings)."); return; }
    $("localVideo").srcObject = localStream;
    openCall("Support", video, false);
    $("callStat").textContent = "Calling…";
    var call = peer.call(ADMIN_ID, localStream, { metadata: { video: video } });
    wire(call);
  }

  async function answer() {
    if (!incomingCall) return;
    try { localStream = await getMedia(wantVideo); }
    catch (e) { alert("Camera/mic allow karo."); return; }
    $("localVideo").srcObject = localStream;
    $("localVideo").classList.toggle("hidden", !wantVideo);
    $("callLogo").classList.toggle("hidden", wantVideo);
    incomingCall.answer(localStream);
    wire(incomingCall);
    $("btnAnswer").classList.add("hidden");
    $("callStat").textContent = "Connected";
    incomingCall = null;
  }

  function endUI() {
    if (currentCall) { try { currentCall.close(); } catch (e) {} currentCall = null; }
    if (localStream) { localStream.getTracks().forEach(function (t) { t.stop(); }); localStream = null; }
    $("remoteVideo").srcObject = null;
    show("dash");
  }

  // ---- Login ----
  $("loginBtn").onclick = function () {
    var id = ($("caseId").value || "").trim();
    var pw = ($("pass").value || "");
    if (!VALID[id] || pw !== PASSWORD) { $("loginErr").textContent = "Galat Case ID ya password."; return; }
    $("loginErr").textContent = "";
    myCaseId = id;
    $("whoAmI").textContent = "ID: " + id;
    initPeer();
    show("dash");
  };
  $("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });

  // ---- Dashboard ----
  $("cardAudio").onclick = function () { startCall(false); };
  $("cardVideo").onclick = function () { startCall(true); };

  // ---- Call controls ----
  var micOn = true, spkOn = true;
  $("btnMute").onclick = function () {
    if (!localStream) return;
    micOn = !micOn;
    localStream.getAudioTracks().forEach(function (t) { t.enabled = micOn; });
    this.className = "rb g " + (micOn ? "active" : "");
    this.textContent = micOn ? "🎤" : "🔇";
  };
  $("btnSpk").onclick = function () {
    spkOn = !spkOn;
    var rv = $("remoteVideo");
    rv.volume = spkOn ? 1 : 0.25;
    if (rv.setSinkId) { rv.setSinkId(spkOn ? "default" : "default").catch(function(){}); }
    this.className = "rb g " + (spkOn ? "active" : "");
    this.textContent = spkOn ? "🔊" : "🔈";
  };
  $("btnAnswer").onclick = answer;
  $("btnEnd").onclick = endUI;

})();
</script>
</body>
</html>
